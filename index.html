<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily Vocabulary Flashcards</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <form id="user-form">
      <input id="username" type="text" placeholder="Enter your name" required />
      <button type="submit">Go</button>
    </form>
    <div id="main-content" style="display:none">
      <div class="main-flex">
        <div class="catalog">
          <h2>Catalog</h2>
          <ul id="date-list"></ul>
        </div>
        <div class="flashcard" id="flashcard">
          <div id="date-label"></div>
          <div class="word-row">
            <div class="word" id="word"></div>
            <span class="phonetic" id="phonetic"></span>
          </div>
          <div id="meaning" class="meaning"></div>
          <div id="sentence" class="sentence"></div>
          <div class="navigation">
            <button id="prev-btn">Previous</button>
            <span id="catalog-text"></span>
            <button id="next-btn">Next</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
